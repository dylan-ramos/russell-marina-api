services:
  app:
    image: russell-marina-api:development
    build:
      target: development
    command: npm run dev
    environment:
      NODE_ENV: development
    ports:
      - 127.0.0.1:${APP_PORT}:3000
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules

volumes:
  app_node_modules:
